<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">

            <div class="card card-info">


                <div class="card-header">
                    <h3 class="card-title">New Blog</h3>
                </div>

                <div class="card-body">

                    <div class="form-group">
                        <label>Categories</label>
                        <select class="select2" multiple="multiple" data-placeholder="Select categories" style="width: 100%;">
                          <option>Branding</option>
                          <option>Logos</option>
                          <option>Products</option>
                          <option>Webs</option>
                          <option>Identity Design</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Title</label>
                        <input class="form-control form-control-lg" type="text" placeholder="Title">
                    </div>

                    <div class="form-group">
                        <label>Subtitle</label>
                        <input class="form-control" type="text" placeholder="Subtitle">
                    </div>


                    <div class="form-group">
                        <label>Text</label>
                        <textarea class="form-control" rows="3" placeholder="Text"></textarea>
                    </div>

                    <div class="custom-file">
                        <input type="file" class="custom-file-input" id="customFile">
                        <label class="custom-file-label" for="customFile">Choose file</label>
                    </div>
                </div>

                <div class="card-footer">
                    <button type="submit" class="btn btn-default">Cancel</button>
                    <button type="submit" class="btn btn-info float-right">Draft</button>
                    <button type="submit" class="btn btn-success float-right">Submit</button>
                </div>
            </div>
        </div>
    </div>
</div>
