<a class="nav-link" data-toggle="dropdown" [innerHTML]="languageSelectorConfig.selectedLanguage.icon"></a>

<div class="dropdown-menu dropdown-menu-right p-0">

    <ng-container  *ngFor="let lang of languageSelectorConfig.languages">

        <a (click)="setSelectedLanguage(lang)" class="dropdown-item" [ngClass]="{'active': languageSelectorConfig.selectedLanguage.value == lang.value}">
            <span [innerHTML]="lang.icon"></span> {{lang.name}}        
        </a>

    </ng-container>

</div>
