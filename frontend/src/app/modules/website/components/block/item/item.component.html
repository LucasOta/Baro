<div class="container mnt-10 mnb-10">
    <ng-container [ngSwitch]="item.typeOfItem">
        <!-- Title -->
        <ng-container *ngSwitchCase="itemTypes.Title">
                <h2>{{item.title[0].quote}}</h2>
        </ng-container>
        
        <!-- Text -->
        <ng-container *ngSwitchCase="itemTypes.Text">        
            <h2>{{item.title[0].quote}}</h2>
            <h4>{{item.subtitle[0].quote}}</h4>
            <div class="row justify-content-between vertical-gap">
                <div class="col-12">
                    <p>{{item.description[0].quote}}</p>
                </div>
            </div>
        </ng-container>
        
        <!-- Video -->
        <ng-container *ngSwitchCase="itemTypes.Video">
            <div class="row vertical-gap dk-gallery">
                <div class="col-12">
                    <div class="dk-box-4">
                        <div class="dk-gallery-video text-center">
                            <a [href]='item.video' class="dk-btn dk-btn-play mt-20 dk-gallery-video-item"></a>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
        
        <!-- Image -->
        <ng-container *ngSwitchCase="itemTypes.Image">
            <div class="row vertical-gap dk-gallery">
                <div class="col-12 col-md-6">
                    <div class="row vertical-gap dk-gallery">
                        <div class="col-12 col-md-6">
                            <a [href]="(item.img[0] | image : 'projects' : '5fd0f75dc3755e8dc810b25a')" class="dk-gallery-item"><img [src]="(item.img[0] | image : 'projects' : '5fd0f75dc3755e8dc810b25a')" alt=""></a>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
        
        <!-- ImageGroup -->
        <ng-container *ngSwitchCase="itemTypes.ImageGroup">
            ImageGroup
        </ng-container>
        
        <!-- Testimonial -->
        <ng-container *ngSwitchCase="itemTypes.Testimonial">
            Testimonial
        </ng-container>
        
        <!-- TextImage -->
        <ng-container *ngSwitchCase="itemTypes.TextImage">
            TextImage
        </ng-container>
        
        <!-- Default -->
        <ng-container *ngSwitchDefault>
            <h3 style="color: red;">Unknown ItemType</h3>
        </ng-container>
        
    </ng-container>
</div>
