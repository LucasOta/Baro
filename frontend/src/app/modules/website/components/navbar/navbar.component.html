<!--
    START: Navbar

    Additional Classes:
        .dk-navbar-sticky
        .dk-navbar-transparent
        .dk-navbar-white
        .dk-navbar-fullscreen || .dk-navbar-(xl, lg, md, sm)-fullscreen
-->
<nav class="dk-navbar dk-navbar-sticky dk-navbar-lg-fullscreen" style="position: static !important;">
    <div class="container">
        <div class="dk-nav-content">
            
            <a [routerLink]="'home'">
                <img src="assets/website/img/logo-baro.svg" alt="" class="custom_logo">
            </a> 

            
            <ul class="dk-nav dk-nav-align-right">
                
                <li class="dk-drop-item">
                    <a [routerLink]="'home'" routerLinkActive="active">{{'Home' | translate}}</a>                        
                <li>
                
                <li class="dk-drop-item">
                    <a [routerLink]="'work'" routerLinkActive="active">{{'Work' | translate}}</a>                        
                <li>
                
                <li class="dk-drop-item">
                    <a [routerLink]="'about'" routerLinkActive="active">{{'About' | translate}}</a>                        
                <li>
                
                <li class="dk-drop-item">
                    <a [routerLink]="'contact'" routerLinkActive="active">{{'Contact' | translate}}</a>                        
                <li>

        
            </ul>
            
        </div>

        <app-language-selector [languageSelectorConfig]="languageSelectorConfig" class="only_desktop"></app-language-selector>

        <div class="dk-navbar-burger" [ngClass]="{'dk-open-fullscreen': fullscreen}" (click)="toggleFullScreen()"><span></span><span></span><span></span></div>
    </div>
</nav>
<div class="dk-navbar dk-navbar-fullscreen" [ngClass]="{'dk-open-fullscreen': fullscreen}">
    <div class="container">
        <div class="d-block"></div>
        <div class="dk-nav-content">
            <ul class="dk-nav dk-nav-align-right fullscreen_list" >

                <li>
                    <a [routerLink]="'home'" (click)="turnOffFullScreen()" routerLinkActive="active">{{'Home' | translate}}</a>                        
                <li>
                
                <li>
                    <a [routerLink]="'work'" (click)="turnOffFullScreen()" routerLinkActive="active">{{'Work' | translate}}</a>                        
                <li>
                
                <li>
                    <a [routerLink]="'about'" (click)="turnOffFullScreen()" routerLinkActive="active">{{'About' | translate}}</a>                        
                <li>
                
                <li>
                    <a [routerLink]="'contact'" (click)="turnOffFullScreen()" routerLinkActive="active">{{'Contact' | translate}}</a>                        
                <li> 
                <li>
                    <app-language-selector [languageSelectorConfig]="languageSelectorConfig"></app-language-selector>
                </li>
            </ul>
        </div>
        <ul class="dk-social-links text-center">
            <li><a href="#" class="dk-social-behance"><span class="fab fa-behance"></span></a></li>
            <li><a href="#" class="dk-social-instagram"><span class="fab fa-instagram"></span></a></li>
            <li><a href="#" class="dk-social-linkedin"><span class="fab fa-linkedin"></span></a></li>
        </ul>
        <div class="dk-navbar-burger" [ngClass]="{'dk-open-fullscreen': fullscreen}" (click)="toggleFullScreen()"><span></span><span></span><span></span></div>
    </div>
</div>
<!-- END: Navbar -->
