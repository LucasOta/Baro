<div class="black_font">
    <div class="dk-box-5 dk-padding-top">
        <div class="container">
            <ul class="dk-isotope-filter text-center">
                <li class="active" data-filter="*">All</li>
                <li data-filter=".branding">Branding</li>
                <li data-filter=".design">Design</li>
                <li data-filter=".mockups">Mockups</li>
                <li data-filter=".photography">Photography</li>
            </ul>
        </div>
    </div>

    <div class="dk-box-2 dk-padding-bot">
        <div class="container">
            <div class="row vertical-gap dk-isotope-grid">
                
                <div class="col-12 col-md-6 dk-isotope-grid-item mockups" *ngFor="let p of projects">
                    <app-work-preview [project]="p"></app-work-preview>
                </div>

            </div>        
        </div>
    </div>
</div>
