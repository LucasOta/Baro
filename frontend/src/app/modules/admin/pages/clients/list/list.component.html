<div class="row">
    <div class="col-12">
        <button [routerLink]="'../create'" type="button" class="btn btn-outline-success" style="margin-bottom: 1rem">{{ 'Add' | translate }}</button>
    </div>
  </div>
  
  <div class="row">
    <div class="col-12">
      <div class="card">
          
        <div class="card-body">
          <table id="clients" class="table table-hover">
            <thead>
                <tr>
                  <th>{{ 'Name' | translate }}</th>
                  <th>{{ 'Website' | translate }}</th>
                  <th>{{ 'Created' | translate }}</th>
                  <th>{{ 'Modified' | translate }}</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let c of clients; trackBy: trackByFn" (click)='edit(c._id)' class="pointer">
                  <td>{{c.name}}</td>
                  <td>{{c.website}}</td>
                  <td>{{c.created}}</td>
                  <td>{{c.modified}}</td>
                </tr>
            </tbody>
          </table>
        </div>
  
      </div>
    </div>
  </div>
