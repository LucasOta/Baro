<input hidden type="file" (change)="onSelectFile($event)" class="custom-file-input" #inputFile>

<div class="row">
    
    <div class="col-12 col-form-label">
        <button (click)="uploadFile()" [disabled]="imgPickerConfig.imgs.length >= imgPickerConfig.maxImgs && imgPickerConfig.maxImgs > 0" type="button" class="btn btn-default">{{ imgPickerConfig.fieldName }}</button>
        <span class="note" *ngIf="imgPickerConfig.note">
            (Note: {{ imgPickerConfig.note }})
        </span>
    </div>
    
    <div class="col-md-3" *ngFor="let img of imgPickerConfig.imgs; trackBy: trackByFn">
        <div class="card custom_img_card">
            <div class="card-body">
                <div class="cornerBtn">
                    <button type="button" class="btn btn-tool" (click)='deleteImg(img)'><i class="fas fa-times"></i></button>
                </div>
                <div *ngIf="img.url" class="img" [style]=" img.url | domSanitizer "></div>
                <div *ngIf="!img.url" class="img" [style]=" (img.name | image : imgPickerConfig.moduleNameFrom : imgPickerConfig.elementIdFrom ) | domSanitizer "></div>
            </div>
        </div>
    </div>
</div>
